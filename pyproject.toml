[project]
name = "khatacall"
version = "0.1.0"
description = "Hinglish voice agent for kirana credit (udhaar) and stock, on Gnani Prisma, Evon and Timbre."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "websockets>=13",
    "numpy>=2.1",
    "scipy>=1.14",
    "soundfile>=0.12",
    "rapidfuzz>=3.10",
    "jiwer>=3.0",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # Microphone capture for scripts/record.py (corpus recording only).
    "sounddevice>=0.5",
]

[tool.uv]
# An application, not a library: run from the repo root, no build step.
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
